<!DOCTYPE html>
<html class="transition-colors duration-300 bg-white dark:bg-slate-900" lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<script>
    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
    } else {
        document.documentElement.classList.remove('dark');
    }
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: {
                    "primary": "#2ab8cb",
                    "background-light": "#f6f8f8",
                    "background-dark": "#121e20",
                    "warm-sand": "#F4E1D2",
                    "surface-dark": "#1e293b",
                },
                fontFamily: {
                    "display": ["Inter"]
                },
                borderRadius: {
                    "DEFAULT": "0.5rem",
                    "lg": "1rem",
                    "xl": "1.5rem",
                    "full": "9999px"
                },
            },
        },
    }
</script>
<style>
    * {
        transition: background-color 0.3s ease, border-color 0.3s ease, text-color 0.3s ease;
    }
    body {
        min-height: max(884px, 100dvh);
        --overlay: rgba(255, 255, 255, 0.85);
        background-image: linear-gradient(var(--overlay), var(--overlay)), url('https://lh3.googleusercontent.com/aida-public/AB6AXuDSnz1lBkIDwEm_p3yaeqk2GPgJ6fo0w7TpMm4CMy-xLs6uhbecfHJFW72FjinVCqpMgwuO14hU2y2X3Wf5PcecAWQKeCc6_RAAMZcGuhCs8-Q4d3FwIxgcRLkmNREE7exXu_PmZHM0UfZ91_gsJ05Wm2PbZR45QDdvZ0uuqk4wPGEpcPKrTNzyaeFdbUC2i3VUBGirKDa7bVKgSUDzboPGMP3qv53TJ9dw5IGYV-2-0sxGHUN8kLtydA');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
    }
    html.dark body {
        --overlay: rgba(15, 23, 42, 0.8);
    }
    .theme-toggle {
        position: absolute;
        top: 1.25rem;
        right: 1.25rem;
        width: 40px;
        height: 40px;
        border-radius: 9999px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .theme-toggle:hover {
        background: rgba(148, 163, 184, 0.15);
    }
    .icon-sun { opacity: 1; position: absolute; }
    .icon-moon { opacity: 0; position: absolute; }
    .dark .icon-sun { opacity: 0; }
    .dark .icon-moon { opacity: 1; }
</style>
</head>
<body class="font-display min-h-screen flex items-center justify-center p-4">
<div class="relative w-full max-w-[480px] bg-white dark:bg-slate-900 border border-transparent dark:border-slate-800 rounded-3xl shadow-xl dark:shadow-2xl overflow-hidden">
<button class="theme-toggle" id="theme-toggle-btn" aria-label="Toggle dark mode" type="button">
<span class="material-symbols-outlined icon-sun text-slate-500">light_mode</span>
<span class="material-symbols-outlined icon-moon text-slate-300">dark_mode</span>
</button>
<div class="px-8 pt-6"><a href="index.html" class="flex items-center gap-1 text-slate-400 dark:text-slate-500 hover:text-primary transition-colors text-sm font-medium"><span class="material-symbols-outlined text-base">arrow_back</span>Back</a></div>
<div class="flex flex-col items-center pt-8 pb-2">
<div class="h-20 flex items-center justify-center">
<img alt="OnSite Logo" class="h-full w-auto object-contain dark:brightness-0 dark:invert" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBmDSy1WO0E9VNmeVRPytnlrv89Ddu3GvXdbuCd0gVMEmZtRQwVg7ZTvPXr-W8FEEKi9gXjzibjPeezrygpWJhNtf9AY9HJa9YqR9VAuEVMZiViT4oMjK_SsjqKYrkhhDdkzJpvQKnNXXb4Bu8K7LWxbppKfH6xDiPXPjDIWQSG9zoaklsixDShOSV4Mp3nbj9GLTNlkqbc7VnReGPL0MjBbrQYw_o0F0R1wjFWG1MR6aTEf9S9NYCg8b9rVEF0oOkcjrg">
</div>
</div>
<div class="px-8 pt-4 pb-4 text-center">
<h1 class="text-slate-900 dark:text-white tracking-tight text-[32px] font-bold leading-tight pb-2">Welcome Back</h1>
<p class="text-slate-600 dark:text-slate-400 text-base font-normal leading-normal">Enter your credentials to access your OnSite account</p>
<div class="mt-4 flex justify-center"><span class="material-symbols-outlined text-primary" style="font-size: 64px;">admin_panel_settings</span></div></div>
<form onsubmit="event.preventDefault(); window.location.href='dashboard.html';" action="#" class="px-8 py-6 space-y-5" method="POST">
<div class="flex flex-col w-full">
<label class="text-slate-700 dark:text-slate-300 text-sm font-semibold leading-normal pb-2 ml-1">Email Address</label>
<input class="form-input flex w-full rounded-xl text-slate-900 dark:text-white border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800/50 focus:border-primary focus:ring-2 focus:ring-primary/20 h-14 placeholder:text-slate-400 dark:placeholder:text-slate-500 p-[15px] text-base font-normal" placeholder="name@company.com" type="email">
</div>
<div class="flex flex-col w-full">
<label class="text-slate-700 dark:text-slate-300 text-sm font-semibold leading-normal pb-2 ml-1">Password</label>
<div class="relative flex w-full items-center">
<input class="form-input flex w-full rounded-xl text-slate-900 dark:text-white border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800/50 focus:border-primary focus:ring-2 focus:ring-primary/20 h-14 placeholder:text-slate-400 dark:placeholder:text-slate-500 p-[15px] pr-12 text-base font-normal" placeholder="Enter your password" type="password">
<button class="absolute right-4 text-slate-400 dark:text-slate-500 hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
<div class="flex items-center mt-2"><input id="remember-me" type="checkbox" class="w-4 h-4 text-primary bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 rounded focus:ring-primary/20"><label for="remember-me" class="ml-2 text-sm text-slate-400 font-medium">Remember me</label></div><div class="flex justify-end mt-2">
</div>
</div>
<div class="pt-4">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl transition-all shadow-lg shadow-primary/25 dark:shadow-primary/20 active:scale-[0.98]" type="submit">
                    Log In
                </button>
</div>
<div class="flex items-center gap-4 py-2">
<div class="h-px bg-slate-200 dark:bg-slate-800 flex-1"></div>
<span class="text-slate-400 dark:text-slate-500 text-xs font-medium uppercase tracking-wider">Or</span>
<div class="h-px bg-slate-200 dark:bg-slate-800 flex-1"></div>
</div>
<div class="text-center pb-4">
<p class="text-slate-600 dark:text-slate-400 text-sm">
                    Don't have an account? 
                    <a class="text-primary font-bold hover:underline ml-1" href="signup.html">Create account</a>
</p>
</div>
</form>
</div>

<script>
    document.getElementById('theme-toggle-btn').addEventListener('click', () => {
        const isDark = document.documentElement.classList.toggle('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });
</script>
</body></html>
