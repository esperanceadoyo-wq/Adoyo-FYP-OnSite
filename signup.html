<!DOCTYPE html>
<html class="transition-colors duration-300 bg-white dark:bg-slate-900" lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Sign Up | OnSite</title>
<script>
    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
    } else {
        document.documentElement.classList.remove('dark');
    }
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght=300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                "colors": {
                    "tertiary": "#f97316",
                    "on-secondary-container": "#1e293b",
                    "primary": "#2ab8cb"
                },
                "fontFamily": {
                    "display": ["Inter"]
                }
            }
        }
    }
</script>
<style>
    * {
        transition: background-color 0.3s ease, border-color 0.3s ease, text-color 0.3s ease;
    }
    body {
        font-family: 'Inter', sans-serif;
        overflow-x: hidden;
        --overlay: rgba(255, 255, 255, 0.85);
        background-image: linear-gradient(var(--overlay), var(--overlay)), url('https://lh3.googleusercontent.com/aida-public/AB6AXuDSnz1lBkIDwEm_p3yaeqk2GPgJ6fo0w7TpMm4CMy-xLs6uhbecfHJFW72FjinVCqpMgwuO14hU2y2X3Wf5PcecAWQKeCc6_RAAMZcGuhCs8-Q4d3FwIxgcRLkmNREE7exXu_PmZHM0UfZ91_gsJ05Wm2PbZR45QDdvZ0uuqk4wPGEpcPKrTNzyaeFdbUC2i3VUBGirKDa7bVKgSUDzboPGMP3qv53TJ9dw5IGYV-2-0sxGHUN8kLtydA');
        background-size: cover;
        background-position: center center;
        background-attachment: fixed;
    }
    html.dark body {
        --overlay: rgba(15, 23, 42, 0.8);
    }
    .glass-card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
    }
    .dark .glass-card {
        background: rgba(15, 23, 42, 0.85);
        border-color: rgba(255, 255, 255, 0.1);
    }
    .theme-toggle {
        position: absolute;
        top: 0.5rem;
        right: 0.5rem;
        width: 40px;
        height: 40px;
        border-radius: 9999px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .theme-toggle:hover {
        background: rgba(148, 163, 184, 0.15);
    }
    .icon-sun { opacity: 1; position: absolute; }
    .icon-moon { opacity: 0; position: absolute; }
    .dark .icon-sun { opacity: 0; }
    .dark .icon-moon { opacity: 1; }
</style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
<div class="w-full max-w-md relative">
<div class="glass-card rounded-[2rem] shadow-2xl p-8 md:p-10 border border-white/20 dark:border-white/10 relative">
<button class="theme-toggle" id="theme-toggle-btn" aria-label="Toggle dark mode" type="button">
<span class="material-symbols-outlined icon-sun text-slate-500">light_mode</span>
<span class="material-symbols-outlined icon-moon text-slate-300">dark_mode</span>
</button>
<div class="pb-4"><a href="index.html" class="flex items-center gap-1 text-slate-400 dark:text-slate-500 hover:text-primary transition-colors text-sm font-medium"><span class="material-symbols-outlined text-base">arrow_back</span>Back</a></div>
<div class="text-center pb-6">
<h1 class="text-slate-900 dark:text-white tracking-tight text-3xl font-bold">Create Account</h1>
<p class="text-slate-600 dark:text-slate-400 text-sm mt-1">Join the OnSite international student community</p>
</div>
<form action="/signup" class="space-y-4" method="POST">
<div>
<label class="text-slate-700 dark:text-slate-300 text-sm font-semibold block mb-1">Full Name</label>
<input class="form-input w-full rounded-xl text-slate-900 dark:text-white border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800/50 h-12 p-3 text-base font-normal" name="full_name" placeholder="John Doe" type="text" required>
</div>
<div>
<label class="text-slate-700 dark:text-slate-300 text-sm font-semibold block mb-1">Email Address</label>
<input class="form-input w-full rounded-xl text-slate-900 dark:text-white border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800/50 h-12 p-3 text-base font-normal" name="email" placeholder="name@university.edu" type="email" required>
</div>
<div>
<label class="text-slate-700 dark:text-slate-300 text-sm font-semibold block mb-1">Password</label>
<input class="form-input w-full rounded-xl text-slate-900 dark:text-white border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800/50 h-12 p-3 text-base font-normal" name="password" placeholder="Create a password" type="password" required>
</div>
<div class="pt-2">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-3 rounded-xl transition-all shadow-lg shadow-primary/25 active:scale-[0.98]" type="submit">Sign Up</button>
</div>
<div class="text-center pt-4 border-t border-slate-100 dark:border-slate-800">
<p class="text-slate-600 dark:text-slate-400 text-sm">
Already have an account? <a class="text-primary font-bold hover:underline ml-1" href="login.html">Log In</a>
</p>
</div>
</form>
</div>
</div>

<script>
    document.getElementById('theme-toggle-btn').addEventListener('click', () => {
        const isDark = document.documentElement.classList.toggle('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });
</script>
</body>
</html>
